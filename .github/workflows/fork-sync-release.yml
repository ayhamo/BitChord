# Fork-only workflow. Once a day it checks upstream BitChord's latest release. When this fork has
# no `fork-v<version>` for it yet, it merges that release into main, runs the phone, shared and PC
# unit tests on the merge, pushes main (and `pc`, which follows main), and starts "Android Release APK"
# (android.yml), which builds, signs and publishes `fork-v<version>`. The PC zip stays a manual run
# of "Fork PC build".
#
# It syncs only (owner, 2026-11-07): it used to build and publish the release itself; android.yml
# does that now for every push to main, so a merge done by hand releases the same way.
#
# If the merge conflicts (the usual case: the fork touches upstream files), or a test fails, nothing
# is pushed: the run fails (GitHub emails the failure) and an issue is opened, so the merge can be
# done by hand (see FORK.md).
name: Fork sync and release

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-release
  cancel-in-progress: false

env:
  UPSTREAM: kushagrasinghx/BitChord

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      sync: ${{ steps.ver.outputs.sync }}
    steps:
      - name: compare upstream's latest release with the fork's releases
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          version=${tag#v}
          echo "upstream release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "fork-v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "fork-v$version already released, nothing to do"
            echo "sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "sync=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.sync == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push the merge
      actions: write    # start android.yml (a push made with this token starts no workflow)
      issues: write     # open an issue when the run fails
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: merge upstream's release into the fork
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"
          git merge --no-edit "refs/tags/$TAG"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" \
            "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      # Every phone and shared unit test on the merge, then every PC one (upstream doesn't build the
      # desktop app, so a merge can break only the PC): a failing test pushes nothing.
      - name: phone and shared tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --continue -Pbitchord.bundleWear=false \
            :app:testDevDebugUnitTest :shared:jvmTest

      - name: PC tests
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" eclipse-temurin:21-jdk bash /work/docker/pc-test.sh
          sudo chown -R "$(id -u):$(id -g)" .

      # Both in one push: `pc` follows main. A merge that changes a workflow file is refused here
      # (this token can't write workflows): that one is merged by hand too.
      - name: push the merge and start the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push --atomic origin HEAD:refs/heads/main HEAD:refs/heads/pc
          gh workflow run android.yml -R "$GITHUB_REPOSITORY" --ref main

      - name: open an issue when the run fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Fork sync failed for upstream $TAG" \
            --body "Merging or testing upstream $TAG failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Nothing was pushed or published. Merge it by hand (see FORK.md) and push: the push to main releases it (android.yml)." \
            || echo "No issue opened (issues are off on this repository); GitHub's failure email still goes out."
