# Fork-only workflow. Every push to main (docs-only pushes aside, as android.yml) and every manual
# run: builds the Windows portable zip of the desktop app, with its own Java inside, and publishes it
# as the release `fork-pc-v<version>`, replacing it when it exists. A normal release since 2026-11-07
# (owner; it was a pre-release), never marked "Latest": the phone's update check reads "Latest", so
# that stays the phone's `fork-v<version>`. The PC's check (DesktopUpdateChecker) looks for the
# `fork-pc-v` tag in the release list instead.
name: Fork PC build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'web/**'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-pc-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the changelog reads main's history back to the previous release

      # Every PC unit test, before anything is built: a failing test stops the release. docker/pc-test.sh
      # builds for Windows as the zip is, with Linux FFmpeg on the test classpath so the decoder tests load.
      - name: PC tests
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" eclipse-temurin:21-jdk bash /work/docker/pc-test.sh
          sudo chown -R "$(id -u):$(id -g)" .

      # Built in the same image as docker/pc-build.sh on the owner's machine, not on the runner: the
      # media keys code needs MinGW headers newer than Ubuntu 24.04's.
      - name: build the zip
        id: build
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*bitchordVersionName"\] = "\(.*\)"/\1/p' build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir out
          # The build number (ForkUpdater): the app offers a rebuild of the same version by it. Also
          # in the notes below as "Build: N", which is where the app reads a release's number.
          docker run --rm -e BITCHORD_BUILD="$GITHUB_RUN_NUMBER" -v "$PWD:/work" -v "$PWD/out:/out" eclipse-temurin:21-jdk bash /work/docker/pc-build.sh
          sudo chown -R "$(id -u):$(id -g)" out
          # GitHub stores an uploaded file's space as a dot: the zip is listed, and downloads, as
          # BitChord.Portable.zip, so that is the name the sums give (`sha256sum -c` beside the download).
          (cd out && sha256sum "BitChord Portable.zip" | sed 's/BitChord Portable\.zip$/BitChord.Portable.zip/' > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt

      - name: check what the zip holds
        run: |
          set -euo pipefail
          listing=$(unzip -l "out/BitChord Portable.zip")
          for entry in "BitChord.exe" "BitChordUpdate.exe" "BitChord.args" "BitChord (log).bat" "runtime/bin/javaw.exe" "lib/bitchord-app.jar"; do
            # A here-string, not echo | grep -q: grep stops at the first match, and under pipefail
            # echo's broken pipe failed the step (2026-11-04).
            grep -qF "BitChord Portable/$entry" <<< "$listing" || { echo "missing: BitChord Portable/$entry"; exit 1; }
          done

      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/BitChord Portable.zip

      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          release="fork-pc-v$VERSION"
          # Same guard as android.yml: GitHub refuses this token a tag on a commit whose workflow
          # files differ from main's, so stop before deleting the old release.
          changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" \
            --jq '[.files[]?.filename | select(startswith(".github/workflows/"))] | length')
          if [ "$changed" != "0" ]; then
            echo "::error::main has changed workflow files since $GITHUB_SHA, so GitHub won't let this run tag it. Nothing was deleted. Run 'Fork PC build' again (it builds main)."
            exit 1
          fi
          {
            echo "BitChord $VERSION for Windows: this fork's desktop app. Not the Android release."
            echo
            echo "Unzip it anywhere and run \`BitChord Portable\\BitChord.exe\`. Java is inside; nothing else to install."
            echo "Everything the app keeps (settings, logins, caches, offline songs) is in \`BitChord Portable\\data\`, so the folder can be moved or copied whole."
            echo "Its first start takes over the settings and data of the earlier \`BitChord.bat\` zip, which are left where they were."
            echo "\`BitChord (log).bat\` runs the same app and writes \`data\\bitchord.log\`, for reporting a problem."
            echo
            echo "Build: $GITHUB_RUN_NUMBER"
            echo   # its own line: the app's update check reads it (ForkUpdater.buildOf)
            echo "Commit: $GITHUB_SHA"
            echo   # the app shows the notes as Markdown: without a blank line these two run together
            echo "Verify: \`gh attestation verify <zip> -R $GITHUB_REPOSITORY\`, or compare with SHA256SUMS.txt."
            echo
            # This fork's changes (PC code only), read before the old release is deleted below.
            bash .github/scripts/fork-changelog.sh fork-pc-v "$VERSION" desktopApp shared sharedUi || echo "(No changelog this time: reading it failed.)"
          } > notes.md
          if gh release view "$release" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$release" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          # -R: on a fork gh defaults to the parent repository, which refuses (HTTP 403)
          gh release create "$release" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "BitChord $VERSION for Windows" --notes-file notes.md
