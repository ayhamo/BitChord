name: Android Release APK

# fork (owner, 2026-11-07): this is the fork's phone release. Upstream's version of this file built
# an unpublished APK with upstream's key, which the fork doesn't have, so it failed on every push.
#
# Every push to main (docs-only pushes aside) and every manual run: the phone and shared unit tests,
# then the prod APKs (com.ayhamo.bitchord, "BitChord") signed with the fork's key, a check of the
# signing certificate, and `fork-v<version>` published with the APKs, their SHA-256 sums and a build
# attestation, replacing that release when it already exists. The app's updater (pointed at this
# fork) offers it when the version is newer than the installed one.
#
# fork-sync-release.yml only merges upstream's releases into main; it starts this afterwards.
# A failing test or build publishes nothing (GitHub emails the failure).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'web/**'
      - 'backend/**'
      - '.github/*-seen.txt'
  workflow_dispatch:

permissions:
  contents: write      # publish the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

concurrency:
  group: android-release
  # Never cut a run off between deleting the old release and publishing the new one.
  cancel-in-progress: false

env:
  # The fork's own release certificate (key in docker/keys/release, gitignored; the secrets hold it).
  # A build signed with anything else fails.
  EXPECTED_CERT_SHA256: 767de1ba5a02b81479bb8112ab6c752fd007cccdbd7f7b01a3cff1c09f3aea2e

jobs:
  build-prod-release:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Android SDK packages
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" \
          "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Every phone and shared unit test: a failing test, upstream's or the fork's, stops the release
    # before anything is built or signed.
    - name: Tests
      run: |
        ./gradlew --no-daemon --continue -Pbitchord.bundleWear=false \
          :app:testDevDebugUnitTest :shared:jvmTest

    - name: Build Signed Prod Release APK
      env:
        FORK_KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
        FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
        FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
      run: |
        set -euo pipefail
        # Optional: empty when the fork has no such secret, and the app copes.
        {
          echo "LASTFM_API_KEY=$LASTFM_API_KEY"
          echo "LASTFM_SECRET=$LASTFM_SECRET"
          echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER"
        } > local.properties
        echo "$FORK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fork.keystore"
        {
          echo "storeFile=$RUNNER_TEMP/fork.keystore"
          echo "storePassword=$FORK_KEYSTORE_PASSWORD"
          echo "keyAlias=$FORK_KEY_ALIAS"
          echo "keyPassword=$FORK_KEYSTORE_PASSWORD"
        } > keystore.properties
        ./gradlew --no-daemon -Pbitchord.bundleWear=false :app:assembleProdRelease
        rm -f keystore.properties local.properties "$RUNNER_TEMP/fork.keystore"

    - name: Check the signatures and name the APKs
      id: apks
      run: |
        set -euo pipefail
        version=$(sed -n 's/.*bitchordVersionName"\] = "\(.*\)"/\1/p' build.gradle.kts)
        [ -n "$version" ] || { echo "no bitchordVersionName in build.gradle.kts"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
        apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        mkdir out
        for apk in app/build/outputs/apk/prod/release/*.apk; do
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" certs.txt
          # http servers on a LAN or Tailscale (app/src/prod/AndroidManifest.xml): a release that
          # refuses them is the bug a user reported, so it is never published again.
          # (to a file: with pipefail, grep -q closing the pipe early can fail aapt2 on a good APK)
          "$(dirname "$apksigner")/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          grep -q 'usesCleartextTraffic([^)]*)=true' manifest.txt \
            || { echo "::error::$apk refuses http (usesCleartextTraffic is not true)"; exit 1; }
          # app-prod-universal-release.apk -> BitChord-v1.9.1.apk, app-prod-arm64-v8a-release.apk -> BitChord-v1.9.1_arm64-v8a.apk
          abi=$(basename "$apk" .apk | sed -e 's/^app-prod-//' -e 's/-release$//')
          if [ "$abi" = "universal" ]; then name="BitChord-v$version.apk"; else name="BitChord-v${version}_$abi.apk"; fi
          cp "$apk" "out/$name"
        done
        (cd out && sha256sum *.apk > SHA256SUMS.txt)
        cat out/SHA256SUMS.txt

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: out/*.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: out/*

    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.apks.outputs.version }}
      run: |
        set -euo pipefail
        release="fork-v$VERSION"
        {
          echo "BitChord $VERSION with this fork's changes (Navidrome library, lyrics, clips, stars, playlists, crossfade on skip, Android Auto; see FORK.md)."
          echo
          echo "Built from this fork's main at $GITHUB_SHA."
          echo
          echo "Signing certificate SHA-256: $EXPECTED_CERT_SHA256"
          echo "Verify: \`gh attestation verify <apk> -R $GITHUB_REPOSITORY\`, or compare with SHA256SUMS.txt."
          echo
          echo "Upstream release: https://github.com/kushagrasinghx/BitChord/releases/tag/v$VERSION"
          echo
          gh release view "v$VERSION" -R kushagrasinghx/BitChord --json body -q .body || true
        } > notes.md
        # GitHub refuses this token a new tag on a commit whose workflow files differ from main's
        # (HTTP 403 "Resource not accessible by integration"): a run for an older commit, after a
        # later push changed a workflow, deleted the old release and then failed to make the new one
        # (2026-11-07). Stop before deleting anything; running this workflow again builds main.
        changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" \
          --jq '[.files[]?.filename | select(startswith(".github/workflows/"))] | length')
        if [ "$changed" != "0" ]; then
          echo "::error::main has changed workflow files since $GITHUB_SHA, so GitHub won't let this run tag it. Nothing was deleted. Run 'Android Release APK' again (it builds main)."
          exit 1
        fi
        if gh release view "$release" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release delete "$release" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
        fi
        # -R: on a fork gh defaults to the parent repository, which refuses (HTTP 403)
        gh release create "$release" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BitChord $VERSION (my fork)" --notes-file notes.md --latest
